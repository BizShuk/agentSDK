# file-agent — sample config
#
# This file is what the sample loads at startup via agent.LoadFile →
# spec.Decode. The schema is the same as the wizard's output and
# `agentsdk run -c path` consumes. spec.Decode rejects unknown fields,
# so typos surface immediately.
#
# Credential resolution follows the post-OAuth-fix rules:
#   - model.credential_kind = "" (default) → registry auto-loads from
#     env; OAuth (ANTHROPIC_OAUTH_TOKEN) outranks API key (ANTHROPIC_API_KEY).
#   - "api_key" → strict: only ANTHROPIC_API_KEY; OAuth env ignored.
#   - "oauth"   → strict: only ANTHROPIC_OAUTH_TOKEN; missing env → error.
#
# All env reads go through viper (config.yaml → ~/.config/<name>/ → .env
# → shell env). No hardcoded dev creds in this sample — missing keys
# surface as visible startup errors.

name: file-agent
tier: standard

model:
  provider: anthropic
  name: claude-sonnet-5
  # credential_kind: ""       # "" | "api_key" | "oauth"

reasoning:
  style: think_then_act

limits:
  max_turns: 15
  autonomy: L2

middleware:
  preset: secure

tools:
  builtin:
    - read
    - write
    - edit
    - bash
    - glob
    - grep
  working_dir: "."
